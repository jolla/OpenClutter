<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenClutter</title>
  <meta name="description" content="OpenClutter: search, draw, export one OpenIntent zip. Import in Hamina for the map and buildings. Include foliage adds canopy." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23238636'/><text x='8' y='12' text-anchor='middle' font-size='10' fill='white'>OC</text></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font: 15px/1.4 ui-sans-serif, system-ui, sans-serif; background: #0e1116; color: #e8eaed; }
    #map { position: absolute; inset: 0; }
    .panel {
      position: absolute; z-index: 1000; top: 12px; left: 12px; width: min(360px, calc(100% - 24px));
      background: #161b22ee; border: 1px solid #30363d; border-radius: 12px; padding: 14px 16px;
      backdrop-filter: blur(8px);
    }
    h1 { font-size: 16px; margin: 0 0 4px; font-weight: 650; }
    .sub { color: #8b949e; font-size: 12px; margin-bottom: 12px; }
    form { display: flex; gap: 8px; }
    input[type=search] {
      flex: 1; background: #0d1117; color: #e8eaed; border: 1px solid #30363d; border-radius: 8px;
      padding: 8px 10px; font: inherit; width: 100%;
    }
    button {
      background: #238636; color: #fff; border: 0; border-radius: 8px; padding: 8px 12px;
      font: inherit; font-weight: 600; cursor: pointer;
    }
    button.secondary { background: #21262d; border: 1px solid #30363d; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .check {
      display: flex; align-items: center; gap: 8px; margin-top: 10px;
      font-size: 13px; color: #e8eaed; user-select: none; cursor: pointer;
    }
    .check input { width: 16px; height: 16px; margin: 0; accent-color: #238636; }
    #copy-terrain { width: 100%; margin-top: 10px; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .row button { flex: 1; }
    .hint { margin: 8px 0 0; font-size: 11px; line-height: 1.35; color: #6e7681; }
    #status { margin-top: 10px; font-size: 12px; color: #8b949e; min-height: 16px; white-space: pre-wrap; }
    #status.err { color: #f85149; }
    .foot {
      margin-top: 12px; padding-top: 10px; border-top: 1px solid #30363d;
      font-size: 11px; color: #6e7681; display: flex; align-items: center; gap: 8px;
    }
    #env-badge {
      display: none; font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; color: #0d1117; background: #d29922;
      border-radius: 4px; padding: 2px 6px;
    }
    #env-badge.on { display: inline-block; }
    .leaflet-tooltip.area-chip {
      background: #161b22ee;
      border: 1px solid #3fb950;
      color: #3fb950;
      border-radius: 8px;
      padding: 3px 8px;
      font: 600 12px/1.3 ui-sans-serif, system-ui, sans-serif;
      box-shadow: none;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h1>OpenClutter</h1>
    <div class="sub">One zip. Import OpenIntent for the map and buildings.</div>
    <form id="search">
      <input type="search" id="q" placeholder="Address" required />
      <button type="submit">Go</button>
    </form>
    <div class="row">
      <button type="button" id="draw" class="secondary">Draw</button>
      <button type="button" id="export" disabled>Export</button>
    </div>
    <p id="draw-hint" class="hint">Drag a box. Click corners, then right-click to finish a polygon. Esc cancels.</p>
    <label class="check" for="include-foliage">
      <input type="checkbox" id="include-foliage" />
      Include foliage
    </label>
    <button type="button" id="copy-terrain" class="secondary" hidden>Copy terrain</button>
    <div id="status">Search, then draw the site.</div>
    <div class="foot">
      <span id="env-badge">dev</span>
      <span id="app-version">v1.0.0</span>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/tree-detect.js"></script>
  <script src="/bbox-area.js"></script>
  <script src="/site-draw.js"></script>
  <script src="/app.js"></script>
</body>
</html>
