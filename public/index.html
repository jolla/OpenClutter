<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenClutter</title>
  <meta name="description" content="OpenClutter: search, draw, export one OpenIntent zip. Import in Hamina for the map and buildings; paste the clipboard JSON for trees." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23238636'/><text x='8' y='12' text-anchor='middle' font-size='10' fill='white'>OC</text></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font: 15px/1.4 ui-sans-serif, system-ui, sans-serif; background: #0e1116; color: #e8eaed; }
    #map { position: absolute; inset: 0; }
    .panel {
      position: absolute; z-index: 1000; top: 12px; left: 12px; width: min(360px, calc(100% - 24px));
      background: #161b22ee; border: 1px solid #30363d; border-radius: 12px; padding: 14px 16px;
      backdrop-filter: blur(8px);
    }
    h1 { font-size: 16px; margin: 0 0 4px; font-weight: 650; }
    .sub { color: #8b949e; font-size: 12px; margin-bottom: 12px; }
    form { display: flex; gap: 8px; }
    input[type=search] {
      flex: 1; background: #0d1117; color: #e8eaed; border: 1px solid #30363d; border-radius: 8px;
      padding: 8px 10px; font: inherit; width: 100%;
    }
    button {
      background: #238636; color: #fff; border: 0; border-radius: 8px; padding: 8px 12px;
      font: inherit; font-weight: 600; cursor: pointer;
    }
    button.secondary { background: #21262d; border: 1px solid #30363d; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .row button { flex: 1; }
    #status { margin-top: 10px; font-size: 12px; color: #8b949e; min-height: 16px; white-space: pre-wrap; }
    #status.err { color: #f85149; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h1>OpenClutter</h1>
    <div class="sub">One zip. Import OpenIntent for map + buildings; paste hamina-clipboard.json for trees.</div>
    <form id="search">
      <input type="search" id="q" placeholder="Address" required />
      <button type="submit">Go</button>
    </form>
    <div class="row">
      <button type="button" id="draw" class="secondary">Draw</button>
      <button type="button" id="export" disabled>Export</button>
    </div>
    <div id="status">Search, then draw the site.</div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="/tree-detect.js"></script>
  <script src="/app.js"></script>
</body>
</html>
